<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MediPOS Pro — Offline</title>
    <link rel="icon" href="/icon-192.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(15, 118, 110, 0.08);
      }
      .badge {
        width: 64px; height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #2dd4bf, #0d9488);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 30px; font-weight: 700;
      }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 20px; }
      button {
        background: #0d9488; color: #fff; border: 0; cursor: pointer;
        padding: 12px 28px; border-radius: 999px; font-size: 14px; font-weight: 600;
      }
      button:hover { background: #0f766e; }
      .hint { margin-top: 16px; font-size: 12px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">+</div>
      <h1>You're offline</h1>
      <p>
        MediPOS Pro can't reach the server right now. The POS terminal keeps working
        offline — sales made offline are queued and sync automatically once the
        connection returns.
      </p>
      <button onclick="location.reload()">Retry connection</button>
      <p class="hint">If the app is installed, reopen it from your home screen to continue selling offline.</p>
    </div>
  </body>
</html>
