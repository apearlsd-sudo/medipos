# MediPOS Pro — desktop packaging (electron-builder)
# Build:  npm run desktop:pack   (unpacked, validation / Linux)
#         npm run desktop:dist   (Windows NSIS installer — run on Windows/CI)
# Shell code lives in electron/ (asar); the Next standalone server and the
# first-run seed DB ship as plain resources/ trees (the server must be
# spawnable from disk, never inside asar).
appId: com.medipospro.desktop
productName: MediPOS Pro
executableName: medipos

directories:
  buildResources: desktop-assets
  output: desktop-dist

files:
  - electron/**/*
  # The shell uses only Electron + Node builtins, so ALL npm dependencies are
  # kept out of app.asar — EXCEPT the electron-updater closure, which the main
  # process needs at runtime (keep this list in sync with `electron-updater`
  # dependency closure; the real server ships its own tree under resources/).
  - "!node_modules/**/*"
  - "!node_modules"
  - "node_modules/electron-updater/**"
  - "node_modules/builder-util-runtime/**"
  - "node_modules/fs-extra/**"
  - "node_modules/graceful-fs/**"
  - "node_modules/jsonfile/**"
  - "node_modules/universalify/**"
  - "node_modules/js-yaml/**"
  - "node_modules/argparse/**"
  - "node_modules/lazy-val/**"
  - "node_modules/lodash.escaperegexp/**"
  - "node_modules/lodash.isequal/**"
  - "node_modules/semver/**"
  - "node_modules/tiny-typed-emitter/**"
  - "node_modules/sax/**"
  - "node_modules/debug/**"
  - "node_modules/ms/**"

asar: true
# compression "normal" (electron-builder default) instead of "maximum":
# the LZMA-ultra payload made NSIS extraction take many minutes on pharmacy
# PCs (266MB of app decompressed at ultra effort). "normal" cuts install
# time to well under a minute for a modest installer-size increase —
# differential updates (blockmap) still keep auto-update downloads small.
compression: normal
electronLanguages:
  - en-US

# Update feed: GitHub Releases. electron-builder bakes this into
# resources/app-update.yml inside every packaged build, so installed apps
# check https://github.com/apearlsd-sudo/medipos/releases automatically
# (electron/main.js falls back to this file when no explicit feed is set).
# Publishing needs a GH_TOKEN with repo scope at package time (CI covers it).
publish:
  provider: github
  owner: apearlsd-sudo
  repo: medipos
  # releaseType release = publish immediately (draft/default + the split-draft
  # assets quirk were fixed manually for v0.3.1); updater needs a visible release.
  releaseType: release

afterPack: electron/pack-hooks.cjs

# resources/server is populated by electron/pack-hooks.cjs (afterPack) —
# electron-builder's extraResources copy respects .gitignore and silently
# drops the server's node_modules, so the copy is done in the hook instead.
extraResources:
  - from: desktop-assets/icon.png
    to: icon.png
  - from: db/custom.db
    to: seed/custom.db

win:
  target:
    - nsis
  icon: desktop-assets/icon.ico

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false   # never destroy the pharmacy's data on uninstall
  # Space-free LITERAL name — do NOT use ${productName} here ("MediPOS Pro" has a
  # space, and electron-builder / GitHub / latest.yml sanitize that space three
  # different ways: on-disk "MediPOS Pro-Setup-x.exe", GitHub asset
  # "MediPOS.Pro-Setup-x.exe", latest.yml path "MediPOS-Pro-Setup-x.exe".
  # electron-updater downloads the latest.yml path → GitHub 404 → every auto-update
  # silently failed up to v0.3.5. A literal dash name makes all three identical.
  artifactName: MediPOS-Pro-Setup-${version}.${ext}
  shortcutName: ${productName}

linux:
  icon: desktop-assets/icon.png
  category: Office
