# MediPOS Pro — Windows NSIS release pipeline.
#
# Trigger A: push a tag named v* (e.g. v0.4.0). The installer is built,
# published to GitHub Releases, and the electron-updater feed files
# (latest.yml + blockmap) land next to it — installed desktop apps then
# auto-update. Keep package.json `version` in sync with the tag.
#
# Trigger B: manual workflow_dispatch (Publish unchecked → dry-run: the
# installer is built and attached to the run as an artifact, nothing released).
#
# The seed DB is NOT in the repo (gitignored for security) — CI regenerates it
# via prisma db push + scripts/seed.ts before electron-builder packs it as
# resources/seed/custom.db.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases (unchecked = dry-run artifact)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-nsis:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Create + seed first-run database (db/custom.db)
        env:
          DATABASE_URL: file:../db/custom.db
        run: |
          npx prisma db push --accept-data-loss
          npx -y tsx scripts/seed.ts

      - name: Build Next.js standalone
        run: npm run build

      - name: Package NSIS (no publish)
        run: npx electron-builder --win nsis --publish never

      # Update-feed guard: v0.3.1..v0.3.5 shipped installers whose auto-updates
      # silently 404'd because the artifact name sanitized differently in three
      # places (on-disk "MediPOS Pro-Setup-x.exe" / GitHub asset
      # "MediPOS.Pro-Setup-x.exe" / latest.yml path "MediPOS-Pro-Setup-x.exe").
      # electron-updater downloads the latest.yml path — so it must match a real
      # packaged artifact, byte-for-byte, or this release must not ship.
      - name: Verify update-feed consistency
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const yml = fs.readFileSync('desktop-dist/latest.yml', 'utf8');
            const m = yml.match(/^path:\s*(.+)$/m);
            const p = m && m[1].trim();
            if (!p) { console.error('FATAL: latest.yml has no path field'); process.exit(1); }
            if (!fs.existsSync('desktop-dist/' + p)) {
              console.error('FATAL: latest.yml path ' + p + ' does not match any packaged artifact — updater would 404');
              process.exit(1);
            }
            if (!fs.existsSync('desktop-dist/win-unpacked/resources/app-update.yml')) {
              console.error('FATAL: app-update.yml missing — updater would be disabled in the installer');
              process.exit(1);
            }
            console.log('FEED_OK ' + p);
          "

      # One atomic upload — electron-builder's parallel GitHub publisher races
      # itself into TWO release objects with split assets (exe+yml / blockmap,
      # seen on v0.3.1 and v0.3.2); a single gh-release step creates exactly one
      # published release with all three files.
      - name: Publish to GitHub Releases (tag / manual publish)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-dist/*.exe
            desktop-dist/latest.yml
            desktop-dist/*.blockmap
          fail_on_unmatched_files: true

      - name: Upload dry-run artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop-dist/*.exe
            desktop-dist/*.yml
            desktop-dist/*.blockmap
          if-no-files-found: error
